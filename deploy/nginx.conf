# nginx + HTTPS жишээ (гар утсанд GPS ба камер ажиллахад HTTPS заавал)
#
# 1) Суулгах:      sudo apt-get install -y nginx certbot python3-certbot-nginx
# 2) Домэйнээ энэ файлд тааруулж (attendance.example.mn) /etc/nginx/sites-available/attendance
# 3) Идэвхжүүлэх:  sudo ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
#                  sudo nginx -t && sudo systemctl reload nginx
# 4) HTTPS:        sudo certbot --nginx -d attendance.example.mn
# 5) systemd үйлчилгээг зөвхөн локал сонсох болгоно (100.0.0.1:8000):
#      /etc/systemd/system/attendance.service → Environment=HOST=127.0.0.1

server {
    listen 80;
    server_name attendance.example.mn;

    client_max_body_size 12m;          # зураг (зургийн хэмжээ) илгээхэд

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
