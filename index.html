<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цаг бүртгэл ба ирцийн систем</title>

<!-- ============ v4.6: ГАР УТСАН (iOS + Android) — PWA тохиргоо ============ -->
<link rel="manifest" href="/static/app.webmanifest">
<meta name="theme-color" content="#0f2137">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon-180.png">
<!-- iOS: Safari-д бүтэн дэлгэцээр, статус мөр нэгдэж ажиллана -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Цаг бүртгэл">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --navy:#0f2137; --navy2:#17324f; --blue:#2f5597; --blue2:#3b82f6;
  --green:#15803d; --green2:#16a34a; --red:#c81e1e; --red-bg:#fdecec;
  --amber:#b45309; --amber-bg:#fff7e6; --gray:#64748b; --line:#e2e8f0;
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  /* v4.6: iPhone home indicator / Android gesture bar-тай давхцахгүй */
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-text-size-adjust:100%;
}
/* v4.6: санамсаргүй товшилт, текстийн сонголт, хос товшилтын зум */
button,.btn,.tab,.bigbtn,.chip{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.bigbtn .lbl,.bigbtn .hintl,.tab,th{-webkit-user-select:none;user-select:none}
input,select,textarea{font-size:16px} /* iOS/Safari: focus хийхэд автомат зум хийхгүй */
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px} /* v4.6: iOS автомат зумыг сэргийлнэ */
a{color:var(--blue2)}
.hidden{display:none !important}

/* ---------- Толгой ---------- */
header.topbar{
  background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff;
  padding:12px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(15,33,55,.25); position:sticky; top:0; z-index:50;
}
header.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
header.topbar .logo{width:34px;height:34px;border-radius:9px;background:#fff2;display:grid;place-items:center}
header.topbar .spacer{flex:1}
header.topbar .who{font-size:13px;opacity:.9;text-align:right;line-height:1.25}
header.topbar .who b{font-size:14.5px}
.clock-badge{
  background:#ffffff1a;border:1px solid #ffffff33;border-radius:10px;padding:4px 12px;
  font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap
}
.clock-badge .t{font-size:17px;font-weight:700;letter-spacing:.3px}
.clock-badge .d{font-size:11.5px;opacity:.85}

/* ---------- Ерөнхий ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0 0 10px;font-size:15.5px;color:var(--navy)}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s
}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#264878}
.btn.green{background:var(--green2);border-color:var(--green2);color:#fff}
.btn.green:hover{background:#128a3d}
.btn.orange{background:#ea7c1f;border-color:#ea7c1f;color:#fff}
.btn.orange:hover{background:#cf6a12}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-size:13px;font-weight:600;color:#334155;margin:0 0 4px}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=date],
input[type=month],select,textarea{
  width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink)
}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--blue2)}
.field{margin-bottom:12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.gray{background:#eef2f6;color:#475569}
.pill.green{background:#e6f6ec;color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.darkred{background:#7f1d1d;color:#fff}
.pill.blue{background:#e8effa;color:var(--blue)}
.ic{vertical-align:-2px;flex:none}
.bigbtn .ic{vertical-align:baseline}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green2)}.dot.red{background:var(--red)}
.dot.amber{background:#f59e0b}.dot.gray{background:#94a3b8}.dot.darkred{background:#7f1d1d}

table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{background:#f8fafc;font-size:12.5px;text-transform:none;color:#475569;font-weight:700;white-space:nowrap}
tbody tr:hover{background:#fafcff}
tr.late td{background:var(--red-bg)}
tr.late td:first-child{box-shadow:inset 4px 0 0 var(--red)}
tr.early td{background:var(--amber-bg)}
tr.early td:first-child{box-shadow:inset 4px 0 0 #f59e0b}
tr.absent td{background:#fef2f2}
tr.absent td:first-child{box-shadow:inset 4px 0 0 #7f1d1d}
tr.onsite td{background:#f0fdf4}
tr.onsite td:first-child{box-shadow:inset 4px 0 0 var(--green2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cn{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.txt-red{color:var(--red);font-weight:700}
.txt-green{color:var(--green);font-weight:700}
.txt-amber{color:var(--amber);font-weight:700}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
/* v4.6: урт утгатай select/товч хуудсыг халиахгүй (гар утсанд онцгой чухал) */
select{max-width:100%}
.row{min-width:0}
.row > *{min-width:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.tile .v{font-size:23px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.tile .u{font-size:12.5px;color:var(--muted);font-weight:600}
.tile.red .v{color:var(--red)} .tile.amber .v{color:var(--amber)}
.tile.green .v{color:var(--green)} .tile.darkred .v{color:#7f1d1d}

.alert{border-radius:12px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;margin-bottom:12px;font-size:14px}
.alert.red{background:var(--red-bg);border:1px solid #f5c2c2;color:#8f1414}
.alert.amber{background:var(--amber-bg);border:1px solid #f3d9a6;color:#8a5209}
.alert.green{background:#e9f9ef;border:1px solid #bfe8cd;color:#14612f}
.alert.blue{background:#eaf1fb;border:1px solid #c7dbf5;color:#1c3f77}
.alert b{font-weight:800}
.alert .ico{font-size:19px;line-height:1.15}

/* ---------- Ажилтны самбар ---------- */
.bigbtn{
  border:none;border-radius:16px;padding:22px 18px;color:#fff;font-weight:800;font-size:17px;
  display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;transition:.15s;
  box-shadow:0 4px 12px rgba(15,23,42,.12)
}
.bigbtn .ico{font-size:30px;line-height:1}
.bigbtn .lbl{font-size:17.5px}
.bigbtn .hintl{font-size:12px;font-weight:600;opacity:.9}
.bigbtn.in{background:linear-gradient(135deg,#16a34a,#12843c)}
.bigbtn.in:hover{background:linear-gradient(135deg,#12843c,#0f7a35)}
.bigbtn.out{background:linear-gradient(135deg,#ea7c1f,#c9600c)}
.bigbtn.out:hover{filter:brightness(.95)}
.bigbtn:disabled{filter:grayscale(.55);opacity:.6;cursor:not-allowed;transform:none}
.status-hero{border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;
  background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.status-hero .big{font-size:22px;font-weight:800}
.status-hero .lbl{font-size:12.5px;text-transform:none;opacity:.85}
.status-hero .circle{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#ffffff22}
.kvrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 22px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);font-size:13.5px}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.worktimer{font-size:34px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* ---------- Таб ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:none;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);
  border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
.tab:hover{background:#e9eef5;color:var(--navy)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);background:#eaf1fb}

/* ---------- Матриц ---------- */
.matrix{font-size:11.5px;border-collapse:separate;border-spacing:2px}
.matrix th{background:transparent;border:none;padding:2px 3px;font-size:10.5px;color:#64748b}
.matrix td{border:none;padding:0}
.mx{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:11px;
  font-weight:700;cursor:default;background:#eef2f6;color:#94a3b8}
.mx.none{background:#f1f5f9;color:#cbd5e1}
.mx.ok{background:#dcfce7;color:#15803d}
.mx.late{background:#fecaca;color:#b91c1c}
.mx.early{background:#fde68a;color:#92400e}
.mx.late_early{background:#fca5a5;color:#7f1d1d}
.mx.working{background:#bfdbfe;color:#1d4ed8}
.mx.off{background:#e2e8f0;color:#94a3b8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#475569;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- Нэвтрэх ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 14px;
  background:radial-gradient(1100px 520px at 12% -8%,#22456e 0%,transparent 60%),
             radial-gradient(900px 480px at 92% 108%,#14406b 0%,transparent 55%),#0b1a2c}
.login-card{width:100%;max-width:940px;background:#fff;border-radius:20px;overflow:hidden;
  display:grid;grid-template-columns:1.05fr 1fr;box-shadow:0 24px 60px rgba(2,10,25,.45)}
.login-left{background:linear-gradient(150deg,#17324f,#0f2137);color:#fff;padding:34px 30px;display:flex;flex-direction:column;gap:16px}
.login-left h1{margin:0;font-size:25px;line-height:1.25}
.login-left .sub{color:#c9d8ea;font-size:14px}
.login-left ul{margin:6px 0 0;padding-left:18px;color:#dbe7f5;font-size:13.5px;line-height:1.9}
.login-right{padding:30px 28px}
.seg{display:flex;background:#eef2f7;border-radius:11px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-weight:700;color:#5a6b80}
.seg button.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(15,23,42,.12)}
.demo-box{background:#f6f9fd;border:1px dashed #b9cde6;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#33506f}
.demo-box b{color:var(--navy)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid #c7dbf5;background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;
  font-weight:600;color:#1c3f77}
.chip:hover{background:#eaf1fb}

/* ---------- Модал ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,15,28,.55);display:grid;place-items:center;
  z-index:100;padding:18px}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;
  box-shadow:0 20px 50px rgba(2,10,25,.4)}
.modal h3{margin:0 0 6px;font-size:18px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* ---------- Тост ---------- */
#toasts{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:390px;pointer-events:none}
.toast{background:#fff;border-left:5px solid var(--blue);border-radius:11px;padding:12px 14px;
  box-shadow:0 10px 28px rgba(15,23,42,.2);animation:sl .25s ease;font-size:14px;
  min-width:0;overflow-wrap:anywhere}
.toast.ok{border-left-color:var(--green2)} .toast.err{border-left-color:var(--red)}
.toast.warn{border-left-color:#f59e0b}
.toast b{display:block;margin-bottom:2px}
@keyframes sl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.footer-note{color:var(--muted);font-size:12.5px;text-align:center;margin-top:28px}
.geo-map{height:190px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#eef4fa;
  display:grid;place-items:center;position:relative}
.geo-map .pin{font-size:34px}
.map-box{height:420px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#eef4fa;
  display:grid;place-items:center;position:relative}
.map-box iframe{width:100%;height:100%;border:0;display:block}
.map-prev{height:180px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#eef4fa;
  display:grid;place-items:center;font-size:12.5px;color:var(--muted)}
.map-prev iframe{width:100%;height:100%;border:0;display:block}
.map-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.geo-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
.geo-opt{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;
  background:#fff;transition:border-color .15s, box-shadow .15s}
.geo-opt:hover{border-color:#94a3b8}
.geo-opt.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(15,42,83,.12);background:#f8fafc}
.geo-opt input{margin-right:6px}
.geo-opt .small{color:var(--muted);margin-top:3px}
.map-coords{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--navy)}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid #fff6;border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.sep{height:1px;background:var(--line);margin:16px 0}
.small{font-size:12.5px;color:var(--muted)}
.nowrap{white-space:nowrap}
.right{text-align:right}
code.k{background:#eef2f7;border-radius:6px;padding:2px 6px;font-size:12.5px}

@media (max-width:820px){
  .login-card{grid-template-columns:1fr}
  .login-left{display:none}
}

/* ---------- v4.6: ГАР УТСАН (iOS / Android) — хүрэхэд эвтэй ---------- */
@media (pointer:coarse), (max-width:700px){
  header.topbar{padding:10px 12px;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  header.topbar .brand{font-size:15.5px}
  header.topbar .who{font-size:12px}
  .wrap{padding:14px 12px 72px}
  .card{padding:14px;border-radius:13px}
  /* Хүрэх талбар: Apple/Google-ийн зөвлөсөн доод хэмжээ 44px */
  .btn,.tab,.chip,.seg button{min-height:44px}
  .btn{padding:11px 15px}
  .btn.small{min-height:40px;padding:9px 13px;font-size:14px}
  .tab{padding:12px 15px;font-size:14.5px}
  .seg button{padding:12px}
  .chip{padding:8px 12px;min-height:38px}
  .login-right{padding:20px 16px}
  .login-wrap{padding:16px 12px}
  input[type=text],input[type=password],input[type=number],input[type=time],
  input[type=date],input[type=month],select,textarea{padding:12px;border-radius:11px}
  /* Толгойн товчнууд багана бүрд эвхэгдэнэ */
  header.topbar .spacer{flex-basis:100%;height:0}
  header.topbar .clock-badge{order:9;margin-left:auto;padding:3px 10px}
  header.topbar .who{order:8}
  /* Модал: доороос гарч ирэх хуудас шиг (гар утсанд эвтэй) */
  .overlay{padding:0;place-items:end center}
  .modal{max-width:none;width:100%;max-height:94vh;border-radius:18px 18px 0 0;
         padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .modal .actions .btn{flex:1 1 44%}
  #toasts{left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));max-width:none}
  .tbl-scroll{-webkit-overflow-scrolling:touch}
  table{font-size:13px}
  th,td{padding:8px 8px;font-size:13px}
  th{font-size:11.5px}
  .matrix{font-size:10px}
  .mx{width:19px;height:19px;border-radius:4px}
  /* Ажилтны «Ажилд орох / Ажлаас буух» — утсанд бүтэн өргөн, дээрээс доош */
  .emp-actions{grid-template-columns:1fr !important}
  .bigbtn{padding:26px 16px;border-radius:18px}
  .bigbtn .ico{font-size:36px}
  .bigbtn .lbl{font-size:19px}
  .worktimer{font-size:30px}
  .status-hero .big{font-size:19px}
  .tile .v{font-size:20px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .kvrow{grid-template-columns:1fr}
  .geo-map{height:170px}
  .map-box{height:300px}
  .map-prev{height:150px}
  .g2,.g3,.g4{grid-template-columns:1fr}
}

/* iOS Safari: 100vh асуудлыг шийдэж, нэвтрэх дэлгэц бүтэн харагдана */
@supports (-webkit-touch-callout:none){
  .login-wrap{min-height:-webkit-fill-available}
}
.print-only{display:none}
@media print{
  /* ---------- v4.4: Хэвлэх / PDF — цэвэр хүснэгт ---------- */
  @page{size:A4 landscape;margin:10mm}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  html,body{background:#fff !important}
  header.topbar,.tabs,#toasts,.footer-note,.no-print,.btn,.pager,.chips{display:none !important}
  .wrap{max-width:none !important;margin:0 !important;padding:0 !important}
  .card{border:0 !important;box-shadow:none !important;border-radius:0 !important;
        padding:0 0 6px !important;margin:0 0 10px !important}
  .grid{gap:8px !important}
  .sep{display:none}
  .print-only{display:block !important}
  .print-head{margin:0 0 8px;border-bottom:1.5px solid #0f2a53;padding-bottom:5px}
  .print-head h1{font-size:15px;margin:0;color:#0f2a53}
  .print-head .meta{font-size:9.5px;color:#475569;margin-top:2px}
  /* хүснэгт бүрэн харагдана — гүйлгэх хайрцаг, өндрийн хязгаар арилна */

function toast(msg, type='ok', title=''){
  const titles = {ok:'Амжилттай', err:'Алдаа', warn:'Анхаар', info:'Мэдээлэл'};
  const d = document.createElement('div');
  d.className = 'toast ' + (type==='info'?'':type);
  d.innerHTML = `<b>${esc(title||titles[type]||'')}</b>${esc(msg)}`;
  $('#toasts').appendChild(d);
  setTimeout(()=>{ d.style.transition='.3s'; d.style.opacity='0'; d.style.transform='translateX(20px)';
    setTimeout(()=>d.remove(),300); }, type==='err'?6500:4000);
}

function withToken(path){
  if (!S.token || /[?&]token=/.test(path)) return path;
  return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(S.token);
}


/* ============================ v3: КАМЕР БА ФОТО ============================ */
let _camStream = null;

function stopCam(){
  if(_camStream){ try{ _camStream.getTracks().forEach(t=>t.stop()); }catch(e){} _camStream = null; }
}

/** Зураг авах цонх: камер (getUserMedia) → эсвэл файл сонгох fallback. Promise<dataURL|null> */
async function capturePhoto(title, hint){
  return new Promise(resolve=>{
    let done = false;
    const finish = v => { if(done) return; done = true; stopCam(); resolve(v); };
    modal(`
      <h3 style="margin:0">${ic('camera')} ${esc(title||'Зураг авах')}</h3>
      <div class="sub" style="margin:4px 0 10px">${esc(hint||'Ажлын байрандаа зургаа авна уу. Зураг нь бүртгэлийн баталгаа болно.')}</div>
      <div id="camWrap" style="position:relative;background:#0f172a;border-radius:14px;overflow:hidden;min-height:260px;display:flex;align-items:center;justify-content:center">
        <video id="camVideo" autoplay playsinline muted style="width:100%;max-height:52vh;display:none"></video>
        <img id="camShot" style="width:100%;max-height:52vh;display:none">
        <div id="camMsg" class="small" style="color:#cbd5e1;padding:26px;text-align:center">Камер асааж байна…</div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="camTake" style="display:none">${ic('camera')} Зураг авах</button>
        <button class="btn" id="camRetake" style="display:none">${ic('rotate')} Дахин авах</button>
        <button class="btn primary" id="camOk" style="display:none">${ic('save')} Хадгалах</button>
        <label class="btn" style="cursor:pointer">${ic('upload')} Файлаас сонгох
          <input type="file" id="camFile" accept="image/*" capture="environment" style="display:none"></label>
        <button class="btn" id="camCancel">Болих</button>
      </div>
      <div class="small" style="margin-top:8px">Зураг нь серверт хадгалагдаж, админ хянана. Ажилтан зөвхөн өөрийн зургийг харна.</div>`);

    const v = $('#camVideo'), shot = $('#camShot'), msg = $('#camMsg');
    const bTake = $('#camTake'), bRe = $('#camRetake'), bOk = $('#camOk');
    let dataUrl = null;

    const bye = ()=>finish(null);
    $('#camCancel').onclick = bye;
    $('#camRetake').onclick = ()=>{ dataUrl=null; shot.style.display='none'; bOk.style.display='none';
      bRe.style.display='none'; bTake.style.display=''; v.style.display=''; startCam(); };
    bOk.onclick = ()=>finish(dataUrl);
    bTake.onclick = ()=>{
      const cv = document.createElement('canvas');
      const w = v.videoWidth||640, h = v.videoHeight||480;
      const scale = Math.min(1, 720/Math.max(w,h));
      cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
      cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
      dataUrl = cv.toDataURL('image/jpeg', 0.7);
      shot.src = dataUrl; shot.style.display='';
      v.style.display='none'; bTake.style.display='none'; bRe.style.display=''; bOk.style.display='';
      msg.style.display='none'; stopCam();
    };
    $('#camFile').onchange = ev=>{
      const f = ev.target.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = ()=>{
        const im = new Image();
        im.onload = ()=>{
          const cv = document.createElement('canvas');
          const scale = Math.min(1, 720/Math.max(im.width,im.height));
          cv.width = Math.round(im.width*scale); cv.height = Math.round(im.height*scale);
          cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
          dataUrl = cv.toDataURL('image/jpeg', 0.7);
          shot.src = dataUrl; shot.style.display=''; v.style.display='none';
          bTake.style.display='none'; bOk.style.display=''; msg.style.display='none'; stopCam();
        };
        im.src = rd.result;
      };
      rd.readAsDataURL(f);
    };

    async function startCam(){
      try{
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('камер дэмжигдэхгүй');
        _camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:720}}, audio:false});
        v.srcObject = _camStream; v.style.display=''; msg.style.display='none'; bTake.style.display='';
      }catch(e){
        msg.style.display=''; msg.innerHTML = 'Камер ашиглах боломжгүй ('+esc(e.message||'зөвшөөрөлгүй')+').<br>' +
          '<b>«Файлаас сонгох»</b> товчоор зургаа оруулна уу (утас дээр камераа шууд нээнэ).';
        bTake.style.display='none';
      }
    }
    startCam();
  });
}

async function api(path, opts={}){
  path = withToken(path);                      // proxy Authorization-ыг устгасан ч ажиллана
  const o = {headers:{'Content-Type':'application/json'}, credentials:'same-origin', ...opts};
  if (S.token) o.headers['Authorization'] = 'Bearer ' + S.token;
  if (S.token) o.headers['X-Auth-Token'] = S.token;
  if (o.body && typeof o.body !== 'string') o.body = JSON.stringify(o.body);
  let res, data;
  try { res = await fetch(path, o); }
  catch(e){ throw new Error('Сервертэй холбогдож чадсангүй. Сүлжээгээ шалгана уу.'); }
  const ct = res.headers.get('content-type')||'';
  if (ct.includes('application/json')) data = await res.json();
  else if (!res.ok) data = {error:'Серверийн алдаа ('+res.status+')'};
  else return res;
  if (!res.ok){
    if (res.status===401){ setToken(null);
      if (S.me && S.view!=='login'){ S.me=null; S.view='login'; render(); } }
    throw new Error(data.error || data.message || 'Алдаа гарлаа ('+res.status+')');
  }
  return data;
}

}
function fmtHMshort(mins){
  const m = Math.max(0, Math.round(mins||0));
  return pad(Math.floor(m/60))+':'+pad(m%60);
}

function monthOptions(back=14){
  const n = new Date(Date.now()+S.offset); const out=[];
  for(let i=0;i<back;i++){
    const d = new Date(n.getFullYear(), n.getMonth()-i, 1);
    out.push(d.getFullYear()+'-'+pad(d.getMonth()+1));
  }
  return out;
}
function dateLabel(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const n = new Date(y, m-1, d);
  const wd = WD[n.getDay()===0?7:n.getDay()];
  return `${y} оны ${m}-р сарын ${d}, ${wd}`;
}

/* ---------------------------- Гео байршил ---------------------------- */
function getPosition(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation) return reject(new Error('Таны төхөөрөмж байршил тодорхойлохыг дэмжихгүй байна.'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({latitude:p.coords.latitude, longitude:p.coords.longitude,
                    accuracy:p.coords.accuracy}),
      e => reject(new Error(e.code===1
        ? 'Байршил авах зөвшөөрөл өгөгдөөгүй байна. Хөтчийн тохиргооноос зөвшөөрнө үү.'
        : 'Байршил тодорхойлогдохгүй байна. Та GPS-ээ асаагаад дахин оролдоно уу.')),
      {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
  });
}
async function getGeoWithDemo(){
  try{
    const pos = await getPosition();
    S.geo = {...pos, demo:false};
    return S.geo;
  }catch(e){
    if (S.meta && S.meta.demo_mode){
      const ok = await confirmModal('Байршил тодорхойлогдохгүй байна',
        'Шалтгаан: '+e.message+'\n\nТуршилтийн (демо) горим идэвхтэй байгаа тул ажлын байрны координатаар үргэлжлүүлж болно. Үргэлжлүүлэх үү?',
        'Тийм, үргэлжлүүлэх','Болих');
      if(!ok) throw new Error('Бүртгэл цуцлагдлаа.');
      S.geo = {latitude:null, longitude:null, accuracy:null, demo:true};
      return S.geo;
    }
    throw e;
  }
}
async function geoCheckUI(silent=false){
  const box = $('#geoBox');
  if (box) box.innerHTML = geoHTML(true);
  let pos;
  try{ pos = await getGeoWithDemo(); }
  catch(e){
    S.geo = null;
    if (box) box.innerHTML = geoHTML(false, e.message);
    if(!silent) toast(e.message,'err','Байршил');
    return null;
  }
  if (pos.demo){
    if (box) box.innerHTML = geoBoxDemo();
    return pos;
  }
  try{
    const r = await api(`/api/geo/check?lat=${pos.latitude}&lng=${pos.longitude}`);
    S.geoResult = r;
    if (box) box.innerHTML = geoHTML(false, null, r);
    return pos;
  }catch(e){
    if (box) box.innerHTML = geoCheckPlain(pos);
    return pos;
  }
}
function geoHTML(busy, err, r){
  if (busy) return `<div class="row"><span class="spin" style="border-color:#94a3b8;border-top-color:#2f5597"></span>
    <span class="small">Байршил тодорхойлж байна…</span></div>`;
  if (err) return `<div class="alert red" style="margin:0"><span class="ico">${ic('pin',20)}</span><div>${esc(err)}</div></div>`;
  if (r) return geoResultHTML(r);
  return `<div class="small">—</div>`;
}
function geoResultHTML(r){
  const ok = r.ok;
  return `<div class="alert ${ok?'green':'red'}" style="margin:0"><span class="ico">${ok?ic('check',20):ic('ban',20)}</span>
    <div><b>${ok?'Ажлын байрандаа байна':'Ажлын байрны хүрээнээс гадна'}</b><br>
    Ажлын байрнаас зай: <b>${r.distance_m===null?'—':r.distance_m+' м'}</b> / Зөвшөөрөгдөх радиус: ${r.radius_m} м
    ${ok?'':`<br><span class="txt-red">${esc(r.message||'Та ажлын байрандаа байхгүй байна. Бүртгэл амжилтгүй.')}</span>`}</div></div>`;
}
function geoBoxDemo(){
  return `<div class="alert amber" style="margin:0"><span class="ico">${ic('flask',20)}</span><div>
    <b>Туршилтийн горим</b><br>Байршил тодорхойлогдохгүй байгаа тул демо координатаар бүртгэл хийгдэнэ.
    Бодит ажиллагаанд GPS заавал шаардана.</div></div>`;

function geoCheckPlain(pos){
  return `<div class="alert blue" style="margin:0"><span class="ico">${ic('pin',20)}</span><div>

      Ажилд ирээгүй эсвэл ажлаас мэдэгдэлгүй явсан цаг, өдөр тасалсанд тооцогдоно.
      Чөлөөтэй байх бол аппаас <b>чөлөө хүсэх</b> шаардлагатай.</div></div>`;
  else if(ds==='leave')
    head = `<div class="alert blue"><span class="ico">${ic('calendar',20)}</span><div><b>Өнөөдөр «Чөлөө» — батлагдсан.</b>

  else if(ds==='working')
    head = `<div class="alert green"><span class="ico">${ic('timer',20)}</span><div><b>Өнөөдөр «Хэвийн» — ажиллаж байна.</b></div></div>`;
  if((S.emp&&S.emp.today_pending_leave&&S.emp.today_pending_leave.length))
    head += `<div class="alert amber"><span class="ico">${ic('alert',20)}</span><div>
      <b>Чөлөөний хүсэлт хүлээгдэж байна.</b> Админ батлаагүй тул энэ өдөр <b>тасалсанд тооцогдоно</b>.
      Хариу ирэх хүртэл ажилд ирэх эсвэл админд хандана уу.</div></div>`;
  if(!r){
    const dayWorkday = S.emp && S.emp.is_workday !== undefined
      ? S.emp.is_workday
      : (S.meta && S.meta.workdays.includes(new Date(Date.now()+S.offset).getDay()===0?7:new Date(Date.now()+S.offset).getDay()));
    if(!dayWorkday)
      return `<div class="alert blue"><span class="ico">${ic('coffee',20)}</span><div><b>Өнөөдөр амралтын өдөр.</b> Бүртгэл хийх шаардлагагүй.</div></div>`;

      return `<div class="alert ${KIND_COLOR[(S.emp.today_leave[0]||{}).kind]||'blue'}"><span class="ico">${ic('calendar',20)}</span><div><b>${esc(S.emp.leave_label)}</b> — та чөлөөтэй байна. Хоцролт, эрт явалт тооцогдохгүй.</div></div>`;
    return head + `<div class="alert amber"><span class="ico">${ic('clock',20)}</span><div><b>Хоцролт гарахгүйн тулд ${esc(S.meta?S.meta.schedule.start:'09:00')} цагаас өмнө бүртгүүлээрэй.</b>
      Хөнгөлөх хугацаа: ${S.meta?S.meta.schedule.grace_minutes:0} минут.</div></div>`;

  let out = head;
  if(r.late_minutes>0 && r.clock_in)
    out += `<div class="alert red"><span class="ico">${ic('alert',20)}</span><div><b>Хоцролт бүртгэгдлээ</b><br>

    out += `<div class="alert amber"><span class="ico">${ic('alert',20)}</span><div><b>Эрт явсан бүртгэгдлээ</b><br>
      Та ажлын цагаас <b>${r.early_minutes} минутаар</b> эрт явсан байна. Энэ минут хасагдана.</div></div>`;

const PRINT_TITLE = {board:'Шууд самбар — ирцийн төлөв', pay:'Цалингийн тооцоо',
  twopay:'Хоёр төлбөр (аванс 25 · цалин 10)',

function printPeriod(){
  if(S.tab==='board') return 'Огноо: '+esc(S.adminDate||todayISO());
  if(S.tab==='photo') return 'Сар: '+monthLabel(S.photoMonth||S.month||todayISO().slice(0,7))
    + ' · Огноо: '+todayISO();
  if(S.tab==='twopay') return 'Үе: '+((S.cycle&&S.cycle.label)?S.cycle.label:'—')
    + ' · Олгох: '+((S.cycle&&S.cycle.payout_date)?S.cycle.payout_date:'—');
  if(['pay','month','matrix','leave'].includes(S.tab)) return 'Сар: '+monthLabel(curMonth())
    + ' · Огноо: '+todayISO();
  return 'Огноо: '+todayISO();
}
function printHead(){
  const who = S.me ? (S.me.role==='admin' ? 'Удирдлага · '+(S.me.label||'admin')
                     : ((S.me.employee?S.me.employee.full_name:'')+' · '+(S.me.employee?S.me.employee.code:'')))
                   : '';
  const title = S.view==='employee' ? 'Ажилтны хуудас' : (PRINT_TITLE[S.tab]||'Тайлан');
  return `<div class="print-only print-head">
    <h1>${esc((S.meta&&S.meta.company_name)||'Цаг бүртгэлийн систем')} — ${esc(title)}</h1>

      ${who?' · '+esc(who):''} · Цаг бүртгэл ба ирцийн систем v4.5</div></div>`;
}

}

const UB = { lat: 47.91884, lng: 106.91770 };          // Улаанбаатар — анхдагч төв

function mapKey(){ return ((S.maps&&S.maps.api_key)||'').trim(); }
function isDemo(){ return !!window.__DEMO__; }

function mapEmbedUrl(lat, lng, z){
  return `https://maps.google.com/maps?q=${Number(lat).toFixed(6)},${Number(lng).toFixed(6)}&z=${z||16}&output=embed`;
}
function gmapsOpenUrl(lat, lng){
  return `https://www.google.com/maps/search/?api=1&query=${Number(lat).toFixed(6)},${Number(lng).toFixed(6)}`;
}
function loadGoogleMaps(key){
  if(window.google && window.google.maps) return Promise.resolve(window.google.maps);
  if(window.__gmapsP) return window.__gmapsP;
  window.__gmapsP = new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&language=mn&region=MN&loading=async';
    sc.async = true; sc.defer = true;
    sc.onload = ()=> (window.google && window.google.maps) ? res(window.google.maps)
                 : rej(new Error('Google Maps кодыг ачаалж чадсангүй'));
    sc.onerror = ()=> rej(new Error('Google Maps ачаалагдсангүй — сүлжээ эсвэл түлхүүрээ шалгана уу'));
    document.head.appendChild(sc);
  });
  return window.__gmapsP;
}

async function initPickerMap(){
  const box = $('#mapBox'); if(!box) return;
  const p = S.mapPick;
  if(isDemo()){                                        // Arena демо: сүлжээгүй
    box.innerHTML = `<div style="text-align:center;padding:16px;max-width:520px">
      <div style="font-size:34px;color:#c0392b">${ic('pin',34)}</div>
      <div class="small">Демо хувилбарт гадаад газрын зураг ачаалагдахгүй.<br>
      Жинхэнэ системд энэ хэсэгт Google Maps харагдаж, дарж байршил сонгоно.</div>
      <div class="map-coords" style="margin-top:8px">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div></div>`;
    return;
  }
  if(!mapKey()){                                       // түлхүүргүй: зөвхөн харах + холбоосоор
    box.innerHTML = `<iframe src="${mapEmbedUrl(p.lat,p.lng)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
    toast('Google Maps түлхүүр тохируулаагүй тул зөвхөн харах горим. Тохиргоо → Google Maps API түлхүүр.', 'info', 'Газрын зураг');
    return;
  }
  try{
    await loadGoogleMaps(mapKey());
  }catch(e){
    box.innerHTML = `<div style="text-align:center;padding:16px;max-width:520px">
      <div class="small txt-red">${esc(e.message)}</div>
      <div class="map-hint">Холбоосоор координат оруулах эсвэл гараар бичих боломжтой хэвээр.</div></div>`;
    return;
  }
  const map = new google.maps.Map(box, {center:{lat:p.lat,lng:p.lng}, zoom:16,
    mapTypeControl:false, streetViewControl:false, fullscreenControl:false});
  const marker = new google.maps.Marker({position:{lat:p.lat,lng:p.lng}, map, draggable:true});
  const circle = new google.maps.Circle({map, center:{lat:p.lat,lng:p.lng}, radius:S.mapPick.radius,
    fillColor:'#2563eb', fillOpacity:0.15, strokeColor:'#2563eb', strokeOpacity:0.6, strokeWeight:1});
  S.mapObj = {map, marker, circle};
  const apply = (lat, lng)=>{ S.mapPick.lat=lat; S.mapPick.lng=lng;
    marker.setPosition({lat,lng}); circle.setCenter({lat,lng});
    const c = $('#mpCoords'); if(c) c.textContent = lat.toFixed(5)+', '+lng.toFixed(5); };
  map.addListener('click', e=>apply(e.latLng.lat(), e.latLng.lng()));
  marker.addListener('dragend', ()=>apply(marker.getPosition().lat(), marker.getPosition().lng()));
  const r = $('#mpRadius');
  if(r) r.oninput = ()=>{ const v=Number(r.value); circle.setRadius(v);
    const o=$('#mpRadiusOut'); if(o) o.textContent = v+' м'; S.mapPick.radius=v; };
}

async function mapGeocode(q){
  if(!q) return;
  if(!mapKey() || !(window.google && window.google.maps)){ toast('Хайлт хийхийн тулд Google Maps түлхүүр шаардлагатай.','warn'); return; }
  const gc = new google.maps.Geocoder();
  gc.geocode({address:q, region:'MN'}, (res, st)=>{
    if(st==='OK' && res && res.length){
      const g = res[0].geometry.location;
      const lat=g.lat(), lng=g.lng();
      S.mapPick.lat=lat; S.mapPick.lng=lng;
      if(S.mapObj){ S.mapObj.map.setCenter({lat,lng}); S.mapObj.marker.setPosition({lat,lng});
                    S.mapObj.circle.setCenter({lat,lng}); }
      const c=$('#mpCoords'); if(c) c.textContent = lat.toFixed(5)+', '+lng.toFixed(5);
      toast('Байршил олдлоо: '+esc(res[0].formatted_address||''), 'ok', 'Хайлт');
    } else if(st==='ZERO_RESULTS'){ toast('Ийм хаяг олдсонгүй.','warn'); }
    else { toast('Хайлт амжилтгүй ('+st+'). Geocoding API идэвхтэй эсэхийг шалгана уу.','err'); }
  });
}

/* ==========================================================================
   ГЕО ХААЛТ — ажилтан БҮРЭЭР (v4.3): талбайгаа дагах | өөрийн | идэвхгүй
   Жолооч гэх мэт нэг цэгт байдаггүй ажилтанд хаалтыг унтраах эсвэл
   өөрийн байршил/радиусыг оноож болно.
   ========================================================================== */
const GEO_MODES = [
  {v:'site',   label:'Талбайгаа дагах', desc:'Оноосон ажлын байр, эсвэл үндсэн гео хаалт'},
  {v:'custom', label:'Өөрийн байршил',  desc:'Өөрийн координат + өөрийн радиус'},
  {v:'off',    label:'Идэвхгүй (хаалтгүй)', desc:'Байршил хязгаарлахгүй — жолооч, хээрийн ажилтан'},
];
function geoOf(e){
  const g = (e && e.geofence) || {};
  return {mode: g.mode || (e&&e.geofence_mode) || 'site',
          source: g.source || 'site',
          radius_m: g.radius_m!=null ? g.radius_m : (e&&e.geo_radius_m),
          lat: g.lat!=null ? g.lat : (e&&e.geo_lat),
          lng: g.lng!=null ? g.lng : (e&&e.geo_lng),
          name: g.name || ''};
}
function geoPillHTML(e){
  const g = geoOf(e);
  if(g.mode==='off' || g.source==='off') return '<span class="pill gray">Гео хаалтгүй</span>';
  if(g.mode==='custom') return `<span class="pill teal">Өөрийн · ${Math.round(g.radius_m||0)} м</span>`;
  return `<span class="pill navy">Талбай · ${g.radius_m?Math.round(g.radius_m)+' м':'—'}</span>`;
}
function geoSubHTML(e){
  const g = geoOf(e);
  if(g.mode==='off' || g.source==='off') return 'Байршил хязгаарлагдахгүй';
  if(g.mode==='custom' && isFinite(g.lat) && isFinite(g.lng))
    return `${Number(g.lat).toFixed(5)}, ${Number(g.lng).toFixed(5)}`;
  return esc(g.name||'—');
}
function geoCellHTML(e){
  return `<div>${geoPillHTML(e)}</div><div class="small" style="color:var(--muted);margin-top:2px">${geoSubHTML(e)}</div>`;
}
function geoActionBtns(e){
  const off = geoOf(e).mode==='off';
  return `<div class="row" style="gap:6px;flex-wrap:wrap">
    <button class="btn small" data-act="emp-geo" data-id="${e.id}">${ic('compass')} Гео хаалт</button>
    ${off
      ? `<button class="btn small primary" data-act="emp-geo-on" data-id="${e.id}">${ic('check')} Идэвхжүүлэх</button>`
      : `<button class="btn small" data-act="emp-geo-off" data-id="${e.id}">${ic('ban')} Хаалтгүй болгох</button>`}
  </div>`;
}

function empGeoSnapshot(){
  const d = S.empGeoDraft || {};
  const chk = document.querySelector('input[name="egMode"]:checked');
  return {mode: (chk&&chk.value) || d.mode || 'site',
          lat: Number(($('#egLat')||{}).value) || d.lat,
          lng: Number(($('#egLng')||{}).value) || d.lng,
          radius_m: Number(($('#egRadius')||{}).value) || d.radius_m || 300};
}
function empGeoPreview(){
  const box = $('#egMapPrev'); if(!box) return;
  const lat = Number(($('#egLat')||{}).value), lng = Number(($('#egLng')||{}).value);
  const rad = Number(($('#egRadius')||{}).value) || 300;
  if(!isFinite(lat) || !isFinite(lng) || !lat || !lng){
    box.innerHTML = '<span class="small">Координат оруулаагүй байна</span>'; return; }
  box.innerHTML = isDemo()
    ? `<div class="small" style="padding:12px;text-align:center">${lat.toFixed(5)}, ${lng.toFixed(5)} · радиус ${rad} м<br>
       <span style="color:var(--muted)">Демо горимд газрын зураг ачаалагдахгүй</span></div>`
    : `<iframe src="${mapEmbedUrl(lat, lng, 16)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
}
function empGeoModal(){
  const e = S.empGeoEmp || {};
  const d = S.empGeoDraft || {};
  const g = geoOf(e);
  const mode = d.mode || g.mode || 'site';
  const def = S.geoDefault || {};
  const lat = d.lat!=null ? d.lat : (g.lat!=null ? g.lat : (def.lat!=null?def.lat:47.9184));
  const lng = d.lng!=null ? d.lng : (g.lng!=null ? g.lng : (def.lng!=null?def.lng:106.9177));
  const radius = d.radius_m || g.radius_m || def.radius_m || 300;
  return `<h3 style="margin:0">${ic('compass')} Гео хаалт — ${esc(e.full_name||'')}</h3>
    <div class="sub" style="margin:2px 0 0">${esc(e.code||'')} · ${esc(e.position||'')} ·
      ${g.mode==='off'?'одоо хаалтгүй':esc(g.name||'')}</div>
    <div class="geo-opts">
      ${GEO_MODES.map(m=>`<label class="geo-opt ${mode===m.v?'on':''}">
        <input type="radio" name="egMode" value="${m.v}" ${mode===m.v?'checked':''} data-act="emp-geo-mode" data-m="${m.v}">
        <b>${m.label}</b><div class="small">${m.desc}</div></label>`).join('')}
    </div>
    <div id="egCustom" style="${mode==='custom'?'':'display:none'}">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn small" data-act="emp-geo-map">${ic('map')} Газрын зурагнаас сонгох</button>
        <input type="text" id="egLink" placeholder="Google Maps холбоос эсвэл 47.9184, 106.9177" style="flex:1;min-width:200px">
        <button class="btn small" data-act="map-parse">${ic('upload')} Холбоосоос авах</button>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px">
        <div class="field"><label class="f">Өргөрөг (lat)</label><input type="number" id="egLat" step="0.00001" value="${lat}"></div>
        <div class="field"><label class="f">Уртраг (lng)</label><input type="number" id="egLng" step="0.00001" value="${lng}"></div>
        <div class="field"><label class="f">Радиус (м)</label><input type="number" id="egRadius" min="20" step="10" value="${radius}"></div>
      </div>
      <div class="map-prev" id="egMapPrev" style="margin-top:4px"></div>
      <div class="map-hint">«Талбайгаа дагах» горимд радиус талбайгаас (эсвэл үндсэн ${def.radius_m||300} м-ээс) авна.
        «Идэвхгүй» горимд ажилтан хаанаас ч бүртгэл хийж болно.</div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn primary" data-act="emp-geo-save" data-id="${e.id}">${ic('save')} Хадгалах</button>
      <button class="btn" data-act="modal-close">Болих</button>
    </div>`;
}

/* ---------------------------- Модал цонхнууд ---------------------------- */
function modal(html){ 
  const old = $('#overlay'); if(old) old.remove();   // давхар модаль үүсэхээс сэргийлнэ
  S.modalOpen = true;
  const o = document.createElement('div'); o.className='overlay'; o.id='overlay';
  o.innerHTML = `<div class="modal">${html}</div>`;
  o.addEventListener('click', ev=>{ if(ev.target===o) closeModal(); });
  document.body.appendChild(o);
  bind();
  return o;
}
function closeModal(){ const o=$('#overlay'); if(o) o.remove(); S.modalOpen=false; }

function confirmModal(title, body, okTxt='Тийм', cancelTxt='Болих'){
  return new Promise(resolve=>{
    const o = modal(`<h3>${esc(title)}</h3>
      <div style="white-space:pre-wrap;color:#334155;margin:8px 0 4px">${esc(body)}</div>
      <div class="actions"><button class="btn" id="mNo">${esc(cancelTxt)}</button>
      <button class="btn primary" id="mYes">${esc(okTxt)}</button></div>`);
    o.querySelector('#mYes').onclick = ()=>{ closeModal(); resolve(true); };
    o.querySelector('#mNo').onclick  = ()=>{ closeModal(); resolve(false); };
  });
}

      <div class="field"><label class="f">Хэлтэс</label><input type="text" id="eDept" value="${esc(e.department||'')}"></div>
      <div class="field"><label class="f">Албан тушаал</label><input type="text" id="ePos" value="${esc(e.position||'')}"></div>
    </div>
    <div class="field"><label class="f">ПИН код ${isNew?'*':'(шинэ бол бичнэ)'}</label><input type="text" id="ePin" value=""></div>
    ${isNew?'':`<div class="field"><label class="f">Төлөв</label>
      <select id="eActive"><option value="1" ${e.active?'selected':''}>Идэвхтэй</option>
      <option value="0" ${!e.active?'selected':''}>Идэвхгүй</option></select></div>`}
    <div class="actions"><button class="btn" data-act="modal-close">Болих</button>
      <button class="btn primary" data-act="emp-save" data-id="${e.id||''}">${ic('save')} Хадгалах</button></div>`);
  return o;
}

/* ---------------------------- Үйлдлүүд ---------------------------- */
async function doClock(type){
  const btn = type==='in' ? $('#btnIn') : $('#btnOut');
  const label = type==='in' ? 'Ажилд орох' : 'Ажлаас буух';
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="ico"><span class="spin"></span></span><span class="lbl">${label}…</span>`; }
  try{
    // v3: эхлээд зураг авна (шаардлагатай бол)
    let photo = null;
    if (photoRequired()){
      if(btn){ btn.disabled = false; btn.innerHTML = `<span class="ico">${ic('camera',30)}</span><span class="lbl">${label}</span><span class="hintl">Зураг авна уу</span>`; }
      photo = await capturePhoto(label + ' — зураг авах',
        'Ажлын байрандаа, нүүрээ харсан зураг авна уу. Зураг нь таны бүртгэлийн баталгаа.');
      if(!photo){ toast('Зураггүйгээр бүртгэл хийх боломжгүй.','warn','Цуцлагдлаа'); return; }
      if(btn){ btn.disabled = true; btn.innerHTML = `<span class="ico"><span class="spin"></span></span><span class="lbl">${label}…</span>`; }
    }
    const pos = await getGeoWithDemo();
    const r = await api('/api/employee/clock-'+(type==='in'?'in':'out'), {
      method:'POST', body:{latitude:pos.latitude, longitude:pos.longitude, accuracy:pos.accuracy,
        demo_mode: !!pos.demo, photo:photo, photo_source: photo?'camera':null,
        note:(($('#empNote')||{}).value||'').trim()}});
    toast(r.message + (r.geofence && r.geofence.distance_m!=null
      ? ` Ажлын байрнаас ${r.geofence.distance_m} м зайд.` : ''), 'ok', 'Бүртгэл амжилттай');
    S.geoResult = r.geofence;
    await loadMyPay(S.month);
    await loadEmpToday();
    await loadEmpHistory(S.month);
    await loadLive(); await loadExtra(); await loadNotifs();
    const rec = r.record;
    if (rec.late_minutes>0) toast(`Та ${rec.late_minutes} минутаар хоцорч бүртгүүллээ. Хоцролт хасагдана.`,'warn','Хоцролт бүртгэгдлээ');
    if (rec.early_minutes>0) toast(`Та ${rec.early_minutes} минутаар эрт явж бүртгүүллээ. Хасна.`,'warn','Эрт явсан бүртгэгдлээ');
  }catch(e){
    toast(e.message,'err','Бүртгэл амжилтгүй');
    if(/ажлын байрандаа байхгүй/.test(e.message)) toast('Та ажлын байрандаа байхгүй байна. Бүртгэл амжилтгүй.','err','Гео хаалт');
    if(btn){ btn.disabled=false; }
    await loadEmpToday();
  }
}

async function saveSettings(){
  const body = {
    schedule_start: $('#cfgStart').value, schedule_end: $('#cfgEnd').value,
    grace_minutes: $('#cfgGrace').value,
    lunch_start: $('#cfgLunchStart') ? $('#cfgLunchStart').value : undefined,
    lunch_end: $('#cfgLunchEnd') ? $('#cfgLunchEnd').value : undefined,
    lunch_paid: $('#cfgLunchPaid') && $('#cfgLunchPaid').checked ? '1':'0',
    require_photo: $('#cfgRequirePhoto') && $('#cfgRequirePhoto').checked ? '1':'0',
    photo_max_kb: $('#cfgPhotoKb') ? $('#cfgPhotoKb').value : undefined,
    notify_start: $('#cfgNotifyStart') && $('#cfgNotifyStart').checked ? '1':'0',
    notify_end: $('#cfgNotifyEnd') && $('#cfgNotifyEnd').checked ? '1':'0',
    notify_missed_minutes: $('#cfgNotifyMins') ? $('#cfgNotifyMins').value : undefined,
    auto_absent: $('#cfgAutoAbsent') && $('#cfgAutoAbsent').checked ? '1':'0',
    company_name: $('#cfgCompany').value, timezone: $('#cfgTz').value,
    admin_user: $('#cfgAdmUser').value,
    workdays: $$('.wd-chk').filter(c=>c.checked).map(c=>c.value).join(',') || '1,2,3,4,5',
    geofence_enabled: $('#cfgGeoOn') && $('#cfgGeoOn').checked ? '1':'0',
    geofence_name: $('#cfgGeoName') ? $('#cfgGeoName').value : undefined,
    geofence_lat: $('#cfgLat') ? $('#cfgLat').value : undefined,
    geofence_lng: $('#cfgLng') ? $('#cfgLng').value : undefined,
    geofence_radius_m: $('#cfgRadius') ? $('#cfgRadius').value : undefined,
    demo_mode: $('#cfgDemo') && $('#cfgDemo').checked ? '1':'0',
    google_maps_api_key: $('#cfgMapsKey') ? $('#cfgMapsKey').value.trim() : undefined,
  };
  const p = $('#cfgAdmPass'); if(p && p.value.trim()) body.admin_password = p.value.trim();
  Object.keys(body).forEach(k=>body[k]===undefined && delete body[k]);
  try{
    const r = await api('/api/admin/settings', {method:'PUT', body});
    S.settings = r.settings;
    await syncTime();
    toast(r.message + ' Ажлын хуваарь: '+r.settings.schedule_start+'–'+r.settings.schedule_end,'ok');
    render();
  }catch(e){ toast(e.message,'err'); }
}

  let header = '';

    const nm = S.me.role==='admin' ? ('Удирдлага · '+(S.me.label||'admin'))
             : (S.me.employee ? S.me.employee.full_name+' · '+S.me.employee.code : 'Ажилтан');
    header = `<header class="topbar">
      <div class="brand"><span class="logo">${ic('clock',20)}</span>
        <span>Цаг бүртгэл${S.meta?' · '+esc(S.meta.company_name):''}</span></div>

      <div class="clock-badge" id="liveClock"><div class="t">${nowStr()}</div><div class="d">${nowDateLabel()}</div></div>
      <div class="who"><b>${esc(nm)}</b><div>${S.me.role==='admin'?'Бүтэн эрх':'Ажилтан'}</div></div>

function bind(){

    ev.preventDefault();
    try{
      const r = await api('/api/auth/employee-login', {method:'POST',
        body:{code:$('#empCode').value.trim(), pin:$('#empPin').value.trim()}});
      setToken(r.token);
      S.me = {role:r.role, employee:r.employee, label:r.employee.full_name};
      S.view='employee'; S.emp=r.today; S.month=todayISO().slice(0,7);
      await loadMyPay(S.month); await loadMyCycle(); await loadEmpToday(); await loadEmpHistory(S.month);
      await loadLive(); await loadExtra(); await loadNotifs();
      if(S.liveTimer) clearInterval(S.liveTimer);
      S.liveTimer = setInterval(()=>{ if(S.view==='employee'){ loadLive(); } }, 30000);
      toast(r.employee.full_name+', тавтай морил!','ok','Нэвтэрлээ');
    }catch(e){ toast(e.message,'err','Нэвтрэх боломжгүй'); }
  };
  const af = $('#adminLoginForm'); if(af) af.onsubmit = async ev=>{
    ev.preventDefault();
    try{

      setToken(r.token);
      S.me = {role:'admin', label:r.name}; S.view='admin'; S.tab='board';
      S.month = todayISO().slice(0,7); S.adminDate = todayISO();
      await loadBoard(true); await loadSettingsOnly(); await loadEmployees();
      toast(r.company_name+' удирдлагын самбарт тавтай морил!','ok','Нэвтэрлээ');

    const act = el.dataset.act;

    if (act==='geodemo') el.onclick = ()=>{
      const g = (S.meta && S.meta.geofence) || {};
      S.geo = {latitude:g.lat, longitude:g.lng, accuracy:0, demo:true, manual:true};
      toast('«'+((g.name)||'Ажлын байр')+'» байршлаар тэмдэглэв (демо горим).','info','Байршил');

    if (act==='tab') el.onclick = ()=>{ S.tab = el.dataset.tab; render(); loadTabData(); };
    if (act==='notif') el.onclick = async ()=>{ await loadNotifs();
      modal(notifPanelHTML());

      if(b) b.onclick = async ()=>{ try{
        const url = (S.me&&S.me.role==='admin')?'/api/admin/notifications/read':'/api/employee/notifications/read';

/* v3.1: чөлөөний хүсэлтийг батлах / татгалзах (мэдэгдэл эсвэл чөлөөний табаас) */
async function decideLeave(id, approve){
  const paid = approve && $('#reqPaid_'+id) ? ($('#reqPaid_'+id).checked?1:0) : 0;
  try{
    const r = await api('/api/admin/leave-requests/'+id+'/decide', {method:'POST',
      body:{approve:!!approve, paid:paid}});
    toast(r.message,'ok', approve?'Чөлөө батлагдлаа':'Хүсэлт татгалзагдлаа');
    await loadNotifs();
    if(S.view==='admin'){ await loadLeaves(S.leaveMonth); await loadPayrollIfLoaded(); }
    if(S.board) { try{ await loadBoard(true); }catch(e){} }
    closeModal(); render();
  }catch(e){ toast(e.message,'err'); }
}
async function refreshMyLeaves(){
  const m = S.month || todayISO().slice(0,7);
  try{
    S.myLeaves = await api('/api/employee/my-leaves?month='+m);
    S.myPay = await api('/api/employee/my-pay?month='+m).catch(()=>S.myPay);
    await loadNotifs();
  }catch(e){}
}
async function loadPayrollIfLoaded(){
  if(S.payroll) { try{ await loadPayroll(S.payroll.month); }catch(e){} }
}
async function loadCycle(period){
  try{
    if(!S.periods||!S.periods.length){
      const p = await api('/api/admin/periods?n=6');
      S.periods = p.periods||[]; S.cycleRules = p.rules;
    }
    S.period = period = period || S.period || ((S.periods[0]&&S.periods[0].period) || null);
    S.cycle = await api('/api/admin/pay-cycle?period='+encodeURIComponent(period||''));
    S.advList = await api('/api/admin/advances?period='+encodeURIComponent(period));
    if(S.cycle&&S.cycle.period) S.period = S.cycle.period;
  }catch(e){ S.cycle = null; toast(e.message,'err','Хоёр төлбөр'); }
}

async function loadMyCycle(){
  try{ S.myCycle = await api('/api/employee/my-pay-cycle'); }catch(e){ S.myCycle = null; }
}

async function loadPayroll(month){
  S.month = month = month || curMonth();
  S.payroll = await api('/api/admin/payroll?month='+month);
  if(!S.payRules) await loadPayRules();
  if(!(S.sites||[]).length) await loadSites(true);
  if(!(S.employees||[]).length) await loadEmployees(true);
}
async function loadPayRules(){
  const r = await api('/api/admin/payroll-rules');
  S.payRules = r.rules;
}
async function loadSites(silent){
  const r = await api('/api/admin/sites');
  S.sites = r.sites; S.geoDefault = r.geofence_default; S.maps = r.maps || {};
  if(!silent && !(S.employees||[]).length) await loadEmployees(true);
}
async function loadLeaves(month){
  S.leaveMonth = month = month || S.leaveMonth || curMonth();
  const [r, emp, rq] = await Promise.all([api('/api/admin/leaves?month='+month),
                                          api('/api/admin/employees'),
                                          api('/api/admin/leave-requests?month='+month+'&status=all')
                                            .catch(()=>({requests:[]}))]);
  S.leaves = r.leaves; S.leaveRequests = rq.requests||[];
  S.employees = emp.employees; S.settings = emp.settings;
  const sums = await Promise.all((S.employees||[]).map(e=>
    api('/api/admin/leaves/'+e.id+'/summary?month='+month).then(x=>[e.id, x.summary]).catch(()=>[e.id, {}])));
  S.leaveSummary = Object.fromEntries(sums);
}
async function loadPayDetail(eid, month){
  const m = month || curMonth();
  const d = await api(`/api/admin/employees/${eid}/pay?month=${m}`);
  const dd = await api(`/api/admin/employees/${eid}/days?month=${m}`);
  d.days = dd.days || [];
  S.payDetail = d;
}

async function loadTabData(){
  if (S.view!=='admin') return;
  if (S.tab==='board' && !S.board) await loadBoard(true);
  else if (S.tab==='pay'){ await loadPayroll(S.month); render(); }
  else if (S.tab==='twopay'){ await loadCycle(S.period); render(); }
  else if (S.tab==='leave'){ await loadLeaves(S.leaveMonth||S.month); render(); }
  else if (S.tab==='site'){ await loadSites(); await loadEmployees(true); render(); }
  else if (S.tab==='month') await loadReport(S.month);
  else if (S.tab==='matrix') await loadMatrix(S.month);
  else if (S.tab==='emp') await loadEmployees();
  else if (S.tab==='geo'){ await loadSettingsOnly(); await loadGeoLog(); render(); }
  else if (S.tab==='cfg'){ await loadSettingsOnly(); await loadAudit(); render(); }
  else if (S.tab==='photo'){ await loadPhotos(true); render(); }   // v3: Фото хяналт
  else if (S.tab==='agent'){ await loadKeys(); render(); }
}

/* ---------------------------- Эхлэл ---------------------------- */
async function boot(){
  await syncTime();
  startClock();
  try{
    const me = await api('/api/auth/me');
    S.me = me;
    if (me.role==='employee'){
      S.view='employee'; S.month=todayISO().slice(0,7);
      await loadMyPay(S.month); await loadMyCycle(); await loadEmpToday(); await loadEmpHistory(S.month);
      await loadLive(); await loadExtra(); await loadNotifs();
      if(S.liveTimer) clearInterval(S.liveTimer);
      S.liveTimer = setInterval(()=>{ if(S.view==='employee'){ loadLive(); } }, 30000);
    } else {
      S.view='admin'; S.tab='board'; S.month=todayISO().slice(0,7); S.adminDate=todayISO();
      await loadBoard(true);
    }
  }catch(e){
    S.view='login'; S.seg='emp'; render();
  }
}
document.addEventListener('DOMContentLoaded', boot);

/* ================= v4.6: ГАР УТСАН — PWA ================= */
// Service worker: offline үед нэвтрэх хуудас, аппын бүрхүүл кэшнээс ажиллана.
// (Зөвхөн http/https; file:// эсвэл демо HTML дээр алгасна)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/static/sw.js', {scope:'/'}).catch(()=>{});
  });
}
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
}
function a2hsHTML(){
  if (!isIOS() || isStandalone()) return '';
  if (localStorage.getItem('a2hs_off') === '1') return '';
  return `<div class="alert blue no-print" id="a2hsBox" style="align-items:center">
    <span class="ico">📲</span>
    <div style="flex:1">
      <b>Утсанд суулгах:</b> Safari-гийн доод <b>Хуваалцах</b> товч (□↑) →
      <b>«Add to Home Screen»</b> («Дэлгэцэнд нэмэх») сонгоно уу.
      Дараа нь төмөр зам, камер, GPS-тэй бүрэн ажиллана.
    </div>
    <button class="btn small" id="a2hsNo">Ойлголоо</button></div>`;
}
window.__a2hs = ()=>{
  const box = document.getElementById('a2hsBox');
  if (box){ box.remove(); localStorage.setItem('a2hs_off','1'); }
};
// v4.4: хэвлэх үед модаль нээлттэй бол зөвхөн түүнийг, эс бөгөөс идэвхтэй табыг хэвлэнэ
window.addEventListener('beforeprint', ()=>{
  document.body.classList.toggle('print-modal', !!document.querySelector('#overlay'));
});
window.addEventListener('afterprint', ()=> document.body.classList.remove('print-modal'));
window.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
// v4.6: iOS home screen зөвлөмж — нэвтэрсний дараа, нэг удаа
(function(){
  try{
    setInterval(()=>{
      const box = a2hsHTML();
      if (!box || document.getElementById('a2hsBox')) return;
      if (!S.me || S.view==='login') return;
      const host = document.querySelector('.wrap');
      if (!host || !host.firstChild) return;
      host.insertAdjacentHTML('afterbegin', box);
      const b = document.getElementById('a2hsNo'); if (b) b.onclick = window.__a2hs;
    }, 1200);
  }catch(e){}
})();
</script>
</body>
